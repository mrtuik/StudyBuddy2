name: Build APK
on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package.json') }}
          restore-keys: npm-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package.json') }}
          restore-keys: gradle-

      - name: Install
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Build web
        env:
          VITE_TG_API_ID: ${{ secrets.TG_API_ID }}
          VITE_TG_API_HASH: ${{ secrets.TG_API_HASH }}
          VITE_TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          VITE_CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          python3 scripts/patch-android.py ${{ github.run_number }}

      - name: Generate icons
        run: npx capacitor-assets generate --android

      - name: Sync
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: StudyBuddy-apk
          path: android/app/build/outputs/apk/release/*.apk
          compression-level: 0
          retention-days: 14
